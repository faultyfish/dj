name: Job Radar — Tests

on:
  workflow_dispatch: 

jobs:
  test:
    name: Validate filters + schema
    runs-on: ubuntu-latest
    timeout-minutes: 5

    defaults:
      run:
        working-directory: job_radar   # all run steps execute inside job_radar/

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python test_filters.py
