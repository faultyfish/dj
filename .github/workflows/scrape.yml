name: Job Radar — Scrape & Deploy

on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours: 00:00, 06:00, 12:00, 18:00 UTC
  workflow_dispatch:         # allow manual trigger from GitHub UI

permissions:
  contents: write            # needed to push to gh-pages branch

jobs:
  scrape-and-deploy:
    name: Scrape → Filter → Store → Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15      # kill runaway jobs

    steps:
      # ---------------------------------------------------------------
      - name: Checkout repo
        uses: actions/checkout@v4

      # ---------------------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # ---------------------------------------------------------------
      - name: Install dependencies
        run: pip install -r requirements.txt

      # ---------------------------------------------------------------
      - name: Run scraper + store to DB
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python run.py "Dublin, Ireland"

      # ---------------------------------------------------------------
      - name: Generate static dashboard HTML
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python generate_dashboard.py

      # ---------------------------------------------------------------
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs          # generated HTML goes here
          publish_branch: gh-pages
          commit_message: "Dashboard updated: ${{ github.run_id }}"
          force_orphan: false          # keep gh-pages history
